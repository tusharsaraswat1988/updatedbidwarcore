    <script>
      (function(){
        try {
          var p = window.location.pathname;
          if (p.startsWith('/scoring-app')) {
            p = p.slice('/scoring-app'.length) || '/';
          }
          if (p === '/admin/login' || p === '/admin/login/') {
            var el = document.createElement('style');
            el.id = 'bidwar-admin-login-preboot';
            el.textContent = 'html,body,#root{background:#F8F7F2 !important;color:#2E281E !important;height:100% !important;overflow:hidden !important;overscroll-behavior:none !important;} #bidwar-boot-splash{display:none !important;}';
            document.head.appendChild(el);
            return;
          }
          var isFan = p.indexOf('/fan') !== -1;
          var fanTheme = null;
          try {
            fanTheme = localStorage.getItem('bidwar_fan_theme') || localStorage.getItem('bidwar_theme');
          } catch(e) {}
          var isFanLight = isFan && fanTheme === 'light';

          var isProtected = (
            p === '' || p === '/' || p === '/pricing' || p === '/contact' || p === '/legal' || p.indexOf('/legal/') === 0 ||
            p === '/auction-tips' || p === '/upcoming-auctions' || p === '/academy' || p.indexOf('/academy/') === 0 ||
            p === '/blog' || p.indexOf('/blog/') === 0 || p.indexOf('/obs') !== -1 || p.indexOf('/display') !== -1 ||
            p.indexOf('/side-display') !== -1 || p.indexOf('/score-display') !== -1 || p.indexOf('/live') === 0 ||
            p.indexOf('/fan') !== -1 || p.indexOf('/register') !== -1 || p === '/login' || p.indexOf('/scorer') !== -1 ||
            p.indexOf('/overlay') !== -1 || p === '/admin' || p.indexOf('/admin/') === 0
          );
          var isOrganizer = !isProtected && (
            p === '/organizer' || p.indexOf('/organizer/') === 0 || p === '/tournament/new' ||
            /^\/tournament\/\d+(\/|$)/.test(p) || /^\/cricket\/\d+(\/|$)/.test(p) || /^\/badminton\/\d+(\/|$)/.test(p)
          );

          if (isOrganizer || isFanLight) {
            var el = document.createElement('style');
            el.id = 'bidwar-light-preboot';
            el.textContent = 'html,body,#root{background:#F8FAFC !important;color:#0F172A !important;} #bidwar-boot-splash{background:#F8FAFC !important;} #bidwar-boot-splash .bidwar-boot-spinner{border-color:rgba(234,179,8,0.2) !important;border-top-color:#EAB308 !important;border-right-color:rgba(234,179,8,0.7) !important;box-shadow:0 0 12px rgba(245,158,11,0.18) !important;} #bidwar-boot-splash .bidwar-boot-text{color:#64748B !important;}';
            document.head.appendChild(el);
            if (isOrganizer) {
              document.documentElement.classList.add('bw-organizer-light');
              document.documentElement.setAttribute('data-surface', 'organizer');
            }
            if (isFanLight) {
              document.documentElement.classList.add('light');
              document.documentElement.setAttribute('data-theme', 'light');
            }
            var setLogo = function() {
              var logo = document.querySelector('#bidwar-boot-splash img');
              if (logo) {
                logo.src = '/assets/branding/bidwar-clean-logo-v2-dark.png';
                logo.onerror = function() { logo.src = '/bidwar-primary-logo.png'; };
              }
            };
            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', setLogo);
            } else {
              setLogo();
            }
            if (window.MutationObserver) {
              var observer = new MutationObserver(function() {
                var logo = document.querySelector('#bidwar-boot-splash img');
                if (logo) {
                  logo.src = '/assets/branding/bidwar-clean-logo-v2-dark.png';
                  logo.onerror = function() { logo.src = '/bidwar-primary-logo.png'; };
                  observer.disconnect();
                }
              });
              observer.observe(document.documentElement, { childList: true, subtree: true });
            }
          }
        } catch(e){}
      })();
    </script>

    <style>

      html,body{margin:0;padding:0;background:#080B14;color:#F8FAFC;font-family:'Inter','Inter Fallback',system-ui,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

      @media(prefers-reduced-motion:reduce){#bidwar-boot-splash img,#bidwar-boot-splash .bidwar-boot-logo,#bidwar-boot-splash .bidwar-boot-spinner{animation:none!important}}
    </style>

    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is sports auction software?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sports auction software is a digital platform that enables tournament organizers to conduct live player auctions for franchise-based leagues. It manages team rosters, bidding rounds, purse limits, player categories, and real-time bid tracking — replacing manual auction boards with a fully automated, broadcast-ready system."
          }
        },
        {
          "@type": "Question",
          "name": "How does cricket auction software work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Cricket auction software like BidWar lets the auction operator control the session from a dashboard — selecting players, starting bid timers, and accepting bids from team owners. Team owners bid from their phones via a dedicated bidding panel. The LED display shows the live action on a projector or TV screen for the audience."
          }
        },
        {
          "@type": "Question",
          "name": "Can BidWar run IPL-style auctions?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. BidWar is purpose-built for IPL-style franchise auctions. It supports player categories (Platinum, Gold, Silver, Emerging), team purse tracking, reserve prices, bid increments, unsold/retain mechanics, and a broadcast-quality LED display — the same format used in professional cricket leagues."
          }
        },
        {
          "@type": "Question",
          "name": "Does BidWar support projector and LED screens?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. BidWar includes a dedicated full-screen LED Display Mode designed for large projectors and TV screens. It features animated player cards, live bid counters, a SOLD stamp animation, team purse strips, and sponsor logo rotation — all in broadcast-quality resolution."
          }
        },
        {
          "@type": "Question",
          "name": "Is BidWar cloud-based?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. BidWar is a fully cloud-based platform. The operator dashboard, team owner panels, and LED display all run in a browser — no app downloads, no local software installation required. All bid data syncs in real time across all connected devices."
          }
        },
        {
          "@type": "Question",
          "name": "Can organizers manage multiple teams?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. BidWar supports unlimited team management within a tournament. Each team can have its own owner login, purse limit, squad size rules, and color branding. Multiple team owners can bid simultaneously from their own devices during a live auction session."
          }
        },
        {
          "@type": "Question",
          "name": "Is BidWar suitable for small local tournaments?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Absolutely. BidWar is designed to scale from 2-team local club auctions to 16-team state-level franchise leagues. The free trial plan supports 2 teams at no cost, making it ideal for first-time organizers or small community tournaments."
          }
        },
        {
          "@type": "Question",
          "name": "Does BidWar support live bidding for team owners?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Each team owner gets a dedicated mobile-optimized bidding panel with a one-tap bid button, real-time purse tracker, squad overview, and live auction status. Owners can bid instantly from any smartphone without installing any application."
          }
        }
