<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BidWar Fan Platform</title>
    <meta name="description" content="Official live spectator fan platform for BidWar tournaments. Real-time cricket and badminton scoring, live player auctions, and team purses." />
    <meta name="theme-color" content="#0B101B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="google-site-verification" content="YMq945swDMCEyo1vcxXqlp9ijR_U7T2413i33dj7TKA" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- BRANDING_ICONS_START -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="shortcut icon" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- BRANDING_ICONS_END -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var t =
            localStorage.getItem('bidwar_fan_theme') ||
            localStorage.getItem('bidwar_theme') ||
            localStorage.getItem('theme');
          var theme = (t === 'light' || t === 'dark') ? t : 'dark';
          document.documentElement.className = theme;
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'light') {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
